<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="BeetleBot project placeholder: write-up in progress">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00205B"/>
      <stop offset="1" stop-color="#000A22"/>
    </linearGradient>
    <pattern id="minor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#13B5EA" stroke-opacity=".09"/>
    </pattern>
    <pattern id="major" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#13B5EA" stroke-opacity=".2" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#minor)"/>
  <rect width="1600" height="1000" fill="url(#major)"/>
  <rect x="40" y="40" width="1520" height="920" fill="none" stroke="#13B5EA" stroke-opacity=".55" stroke-width="2"/>

  <g font-family="Consolas, Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#CFE9F7">
    <!-- registration marks -->
    <g stroke="#13B5EA" stroke-width="3" fill="none">
      <path d="M120 170V120H170M1430 120H1480V170M1480 830V880H1430M170 880H120V830"/>
    </g>

    <!-- reticle -->
    <g stroke="#13B5EA" fill="none">
      <circle cx="800" cy="440" r="210" stroke-width="3" stroke-opacity=".9"/>
      <circle cx="800" cy="440" r="150" stroke-width="2" stroke-opacity=".45" stroke-dasharray="10 12"/>
      <line x1="800" y1="190" x2="800" y2="690" stroke-width="2" stroke-opacity=".6" stroke-dasharray="44 10 8 10"/>
      <line x1="550" y1="440" x2="1050" y2="440" stroke-width="2" stroke-opacity=".6" stroke-dasharray="44 10 8 10"/>
    </g>

    <text x="800" y="468" text-anchor="middle" font-size="84" font-weight="700" letter-spacing="10" fill="#FFFFFF">BEETLEBOT</text>
    <text x="800" y="770" text-anchor="middle" font-size="26" letter-spacing="6" fill="#13B5EA">DESIGN COMPETITION</text>
    <text x="800" y="812" text-anchor="middle" font-size="22" letter-spacing="5" fill="#8FB8D6">WRITE-UP IN PROGRESS</text>

    <text x="120" y="236" font-size="22" letter-spacing="3" fill="#8FB8D6">COURSE PROJECT</text>
    <text x="1480" y="236" font-size="22" letter-spacing="3" text-anchor="end" fill="#8FB8D6">REV —</text>
  </g>
</svg>
