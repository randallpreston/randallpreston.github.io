<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Schematic of a two-cell hydrogen permeation setup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00205B"/>
      <stop offset="1" stop-color="#000A22"/>
    </linearGradient>
    <pattern id="minor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#13B5EA" stroke-opacity=".09"/>
    </pattern>
    <pattern id="major" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#13B5EA" stroke-opacity=".2" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 1 10 5 0 9z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#minor)"/>
  <rect width="1600" height="1000" fill="url(#major)"/>
  <rect x="40" y="40" width="1520" height="920" fill="none" stroke="#13B5EA" stroke-opacity=".55" stroke-width="2"/>

  <g font-family="Consolas, Menlo, 'DejaVu Sans Mono', 'Courier New', monospace">
    <!-- electrolyte -->
    <rect x="262" y="360" width="506" height="370" fill="#13B5EA" fill-opacity=".14"/>
    <rect x="832" y="360" width="506" height="370" fill="#13B5EA" fill-opacity=".14"/>
    <!-- cells -->
    <g fill="none" stroke="#13B5EA" stroke-width="4">
      <path d="M260 280V730H770V280"/>
      <path d="M830 280V730H1340V280"/>
    </g>
    <!-- specimen membrane -->
    <rect x="770" y="250" width="60" height="520" fill="#C9D3E0"/>
    <rect x="770" y="250" width="60" height="520" fill="none" stroke="#FFFFFF" stroke-width="2"/>

    <!-- electrodes -->
    <g stroke="#CFE9F7" stroke-width="10" stroke-linecap="square">
      <line x1="340" y1="230" x2="340" y2="640"/>
      <line x1="1260" y1="230" x2="1260" y2="640"/>
    </g>

    <!-- hydrogen path -->
    <g fill="#FFFFFF">
      <circle cx="690" cy="440" r="11"/><circle cx="725" cy="520" r="11"/><circle cx="700" cy="600" r="11"/>
      <circle cx="790" cy="470" r="9"/><circle cx="810" cy="560" r="9"/>
      <circle cx="885" cy="450" r="11" fill-opacity=".55"/><circle cx="905" cy="590" r="11" fill-opacity=".55"/>
    </g>
    <line x1="600" y1="680" x2="990" y2="680" stroke="#FFFFFF" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1004" y="688" font-size="22" letter-spacing="3" fill="#FFFFFF">H DIFFUSION</text>

    <text x="515" y="330" text-anchor="middle" font-size="24" letter-spacing="4" fill="#CFE9F7">CHARGING CELL</text>
    <text x="1085" y="330" text-anchor="middle" font-size="24" letter-spacing="4" fill="#CFE9F7">OXIDATION CELL</text>
    <text x="800" y="220" text-anchor="middle" font-size="22" letter-spacing="4" fill="#13B5EA">SPECIMEN</text>

    <text x="120" y="150" font-size="26" letter-spacing="4" fill="#13B5EA">ME³ LAB · VILLANOVA</text>
    <text x="1480" y="150" font-size="22" letter-spacing="3" text-anchor="end" fill="#8FB8D6">DEVANATHAN–STACHURSKI</text>

    <!-- title block -->
    <g stroke="#13B5EA" stroke-opacity=".8" stroke-width="2" fill="none">
      <rect x="1040" y="800" width="480" height="120"/>
      <line x1="1040" y1="860" x2="1520" y2="860"/>
    </g>
    <text x="1060" y="840" font-size="22" letter-spacing="3" fill="#FFFFFF">H PERMEATION · DUAL CELL</text>
    <text x="1060" y="898" font-size="18" letter-spacing="2" fill="#8FB8D6">SCHEMATIC · NOT TO SCALE</text>
  </g>
</svg>
