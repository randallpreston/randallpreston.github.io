<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Randall Preston</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@500&display=swap">
  <!-- Self-contained styles: GitHub Pages serves this file from any missing URL, so relative CSS paths would break. -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      padding: 24px 16px; background: #000; color: #fff;
      font-family: "Archivo", "Segoe UI", system-ui, sans-serif; text-align: center;
    }
    .code { font-family: "JetBrains Mono", Consolas, monospace; font-size: .75rem; letter-spacing: .14em; color: #13b5ea; text-transform: uppercase; }
    h1 { margin: 16px 0 0; font-size: clamp(2.5rem, 8vw, 5rem); font-stretch: 125%; font-weight: 800; line-height: 1; }
    p { margin: 20px auto 0; max-width: 40ch; color: #a7b2c5; font-size: 1.125rem; line-height: 1.5; }
    a {
      display: inline-flex; align-items: center; min-height: 52px; margin-top: 32px; padding: 0 24px;
      border-radius: 4px; background: #13b5ea; color: #00123a; font-weight: 700; text-decoration: none;
    }
    a:hover { background: #5ccdf3; }
    a:focus-visible { outline: 2px solid #13b5ea; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Off track.</h1>
    <p>This page doesn’t exist. Let’s get you back to the paddock.</p>
    <!-- If the site lives at USERNAME.github.io/REPO/ instead of USERNAME.github.io, change "/" to "/REPO/". -->
    <a href="/">Back to home</a>

</body>
