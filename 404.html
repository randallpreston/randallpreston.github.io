<!doctype html>
<html lang="en">
<head>

  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#e8ebee">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- Self-contained styles: GitHub Pages serves this file from any missing URL, so relative CSS paths would break. -->
  <style>
    :root { color-scheme: light; accent-color: #0066a6; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      padding: 24px 16px; background: #e8ebee; color: #10192b;
      font-family: "Libre Franklin", "Franklin Gothic Medium", "Segoe UI", system-ui, sans-serif; text-align: center;
    }
    h1 {
      margin: 0; font-family: "Big Shoulders", "Arial Narrow", sans-serif;
      font-size: clamp(3.5rem, 16vw, 8rem); font-weight: 800; line-height: 0.88; text-transform: uppercase;
    }
    p { margin: 20px auto 0; max-width: 40ch; color: #3c4a5e; font-size: 1.125rem; line-height: 1.5; text-wrap: pretty; }
    a {
      display: inline-flex; align-items: center; min-height: 52px; margin-top: 32px; padding: 0 24px;
      background: #0066a6; color: #fff; font-weight: 700; text-decoration: none;
    }
    a:hover { background: #00205b; }
    a:focus-visible { outline: 2px solid #00205b; outline-offset: 3px; }
    ::selection { background: #0066a6; color: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>Off track</h1>
